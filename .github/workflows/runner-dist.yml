name: Runner distribution - idmtest ZIPs

# Builds the idmtest ZIP for each OS (the jlink runtime is per OS), smoke-tests the unzipped launcher
# and keeps the ZIP as a workflow artifact. Nothing is published as a release.
#
# Runs when it matters, not on every commit: on a version tag (v1.0.0, …), on demand (Run workflow
# in the Actions tab), and on pull requests that change the packaging itself.
on:
  push:
    tags: [ 'v*' ]
    # To also build the ZIPs on every push to main (the behaviour before ITF-60), uncomment the
    # lines below. Tag pushes still build: GitHub does not evaluate path filters for tag pushes.
    # branches: [ main ]
    # paths:
    #   - 'idm-test-*/**'
    #   - 'idm-connector-*/**'
    #   - 'pom.xml'
    #   - '.github/workflows/runner-dist.yml'
  pull_request:
    paths:
      - 'idm-test-runner/src/dist/**'
      - 'idm-test-runner/src/assembly/**'
      - 'idm-test-runner/pom.xml'
      - '.github/workflows/runner-dist.yml'
  workflow_dispatch:

jobs:
  dist:
    name: idmtest ZIP (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14: arm64, macos-15-intel: x64, windows-latest: x64, ubuntu-latest: x64
        os: [ macos-14, macos-15-intel, windows-latest, ubuntu-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build the ZIP
        shell: bash
        run: ./mvnw -B -Pdist -DskipTests package -pl idm-test-runner -am

      - name: Smoke test (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/smoke dir"
          unzip -q idm-test-runner/target/idmtest-*.zip -d "$RUNNER_TEMP/smoke dir"
          out=$("$RUNNER_TEMP/smoke dir/idmtest/bin/idmtest" --version)
          echo "$out"
          case "$out" in "idmtest "*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
          # init writes a sample workspace; validate checks it without connecting (both exit 0).
          "$RUNNER_TEMP/smoke dir/idmtest/bin/idmtest" init "$RUNNER_TEMP/smoke ws"
          "$RUNNER_TEMP/smoke dir/idmtest/bin/idmtest" validate --workspace "$RUNNER_TEMP/smoke ws"

      - name: Unzip (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem idm-test-runner/target/idmtest-*.zip | Select-Object -First 1
          Expand-Archive -Path $zip.FullName -DestinationPath (Join-Path $env:RUNNER_TEMP 'smoke dir')

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call "%RUNNER_TEMP%\smoke dir\idmtest\bin\idmtest.cmd" --version > "%RUNNER_TEMP%\version.txt" || exit /b 1
          type "%RUNNER_TEMP%\version.txt"
          findstr /b /c:"idmtest " "%RUNNER_TEMP%\version.txt" || exit /b 1
          rem init writes a sample workspace; validate checks it without connecting (both exit 0).
          call "%RUNNER_TEMP%\smoke dir\idmtest\bin\idmtest.cmd" init "%RUNNER_TEMP%\smoke ws" || exit /b 1
          call "%RUNNER_TEMP%\smoke dir\idmtest\bin\idmtest.cmd" validate --workspace "%RUNNER_TEMP%\smoke ws" || exit /b 1

      - name: Upload the ZIP
        uses: actions/upload-artifact@v7
        with:
          name: idmtest-${{ matrix.os }}
          path: idm-test-runner/target/idmtest-*.zip
          if-no-files-found: error
          retention-days: 14
