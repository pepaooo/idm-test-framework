name: Database provisioning and directory update
description: Insert an application account, verify it, then update and delete the directory entry

fixtures:
  user:
    generate: random-user

steps:
  - ldap.create:
      dn: "cn=${user.userId},ou=users"
      attributes:
        cn: "${user.userId}"
        sn: "${user.lastName}"
        givenName: "${user.firstName}"
        title: Analyst

  - db.execute:
      description: "Create the SAP account for ${user.userId}"
      database: test-db
      statement: "INSERT INTO sap_users (username, status) VALUES (?, ?)"
      params: ["${user.userId}", "ACTIVE"]

  - db.verify:
      description: Wait until the account is ACTIVE
      database: test-db
      query: "SELECT status FROM sap_users WHERE username = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 1
        row: { status: ACTIVE }
      wait: true

  - ldap.update:
      dn: "cn=${user.userId},ou=users"
      attributes:
        title: Engineer

  - ldap.verify:
      dn: "cn=${user.userId},ou=users"
      expect:
        title: Engineer

  - ldap.delete:
      dn: "cn=${user.userId},ou=users"

cleanup:
  - db.execute:
      description: Remove the SAP account
      database: test-db
      statement: "DELETE FROM sap_users WHERE username = ?"
      params: ["${user.userId}"]
