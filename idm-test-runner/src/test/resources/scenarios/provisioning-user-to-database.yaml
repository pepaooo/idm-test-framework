name: Provision a user to the database
description: Insert a user row and verify it lands with the expected attributes

fixtures:
  user:
    generate: random-user
    values:
      department: Sales
      jobTitle: Sales Representative

steps:
  - db.execute:
      database: test-db
      statement: "INSERT INTO users (user_id, first_name, last_name, email, department, job_title, active) VALUES (?, ?, ?, ?, ?, ?, ?)"
      params:
        - "${user.userId}"
        - "${user.firstName}"
        - "${user.lastName}"
        - "${user.email}"
        - "${user.department}"
        - "${user.jobTitle}"
        - true

  - db.verify:
      database: test-db
      query: "SELECT * FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 1
        row:
          first_name: "${user.firstName}"
          last_name: "${user.lastName}"
          email: "${user.email}"
          department: "${user.department}"
      wait: true

cleanup:
  - db.execute:
      database: test-db
      statement: "DELETE FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
