runner.cli.usage=Uso: idmtest <comando> [opciones]\n\
\n\
Comandos:\n\
\  init [<dir>]   crea un espacio de trabajo con un escenario y una configuración de ejemplo\n\
\  validate       comprueba los escenarios sin conectarse a ningún sistema\n\
\  run            ejecuta los escenarios contra los sistemas de un perfil\n\
\n\
Opciones:\n\
\  --workspace <dir>   la carpeta del espacio de trabajo (por defecto, la carpeta actual)\n\
\  --profile <nombre>  el perfil de configuración (config/application-<nombre>.yml)\n\
\  --scenario <glob>   solo los escenarios cuyo nombre coincida\n\
\  --locale <en|es>    el idioma de los mensajes y los informes\n\
\  --verbose           muestra también el registro del framework en la consola\n\
\  --help, -h          muestra esta ayuda\n\
\  --version           muestra la versión
