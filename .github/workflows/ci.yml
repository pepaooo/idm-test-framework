name: CI - Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ===================================================================
      # Checkout
      # ===================================================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ===================================================================
      # Setup Java
      # ===================================================================
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # ===================================================================
      # Build
      # ===================================================================
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # ===================================================================
      # Run Configuration Tests (no containers needed)
      # ===================================================================
      - name: Run Configuration Tests
        run: mvn test -Dtest=ConfigurationTest -pl idm-test-scenarios

      # ===================================================================
      # Run Integration Tests (with Testcontainers)
      # ===================================================================
      - name: Run Integration Tests
        run: mvn verify -pl idm-test-scenarios
        env:
          # Testcontainers needs Docker
          TESTCONTAINERS_RYUK_DISABLED: false

      # ===================================================================
      # Upload Test Results
      # ===================================================================
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

      # ===================================================================
      # Publish Test Report
      # ===================================================================
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false

      # ===================================================================
      # Upload Coverage (optional - requires jacoco)
      # ===================================================================
      # - name: Upload Coverage to Codecov
      #   if: always()
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./target/site/jacoco/jacoco.xml
      #     fail_ci_if_error: false

  # ===================================================================
  # Code Quality Check (optional)
  # ===================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # Compile only to check for compilation errors
      - name: Compile
        run: mvn clean compile test-compile

      # Optional: Add SpotBugs, Checkstyle, PMD, etc.
      # - name: Run SpotBugs
      #   run: mvn spotbugs:check

      # - name: Run Checkstyle
      #   run: mvn checkstyle:check
