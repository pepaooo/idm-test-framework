name: Modify a user's attributes in the database
description: Update department and job title, then verify the changes stuck

fixtures:
  user:
    generate: random-user
    values:
      department: Sales
      jobTitle: Sales Representative

steps:
  - db.execute:
      database: test-db
      statement: "INSERT INTO users (user_id, first_name, last_name, email, department, job_title, active) VALUES (?, ?, ?, ?, ?, ?, ?)"
      params:
        - "${user.userId}"
        - "${user.firstName}"
        - "${user.lastName}"
        - "${user.email}"
        - "${user.department}"
        - "${user.jobTitle}"
        - true
      undo:
        statement: "DELETE FROM users WHERE user_id = ?"
        params: ["${user.userId}"]

  - db.execute:
      database: test-db
      statement: "UPDATE users SET department = ?, job_title = ? WHERE user_id = ?"
      params:
        - "Marketing"
        - "Marketing Manager"
        - "${user.userId}"

  - db.verify:
      database: test-db
      query: "SELECT * FROM users WHERE user_id = ? AND department = ?"
      params: ["${user.userId}", "Marketing"]
      expect:
        rowCount: 1
      wait: true

  - db.verify:
      database: test-db
      query: "SELECT * FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 1
        row:
          department: "Marketing"
          job_title: "Marketing Manager"
