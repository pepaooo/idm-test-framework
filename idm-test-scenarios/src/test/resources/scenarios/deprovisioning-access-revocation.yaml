name: Revoke all access during deprovisioning
description: Grant access to three systems, verify the grants, revoke them all, then verify none remain

fixtures:
  user:
    generate: random-user

steps:
  - db.execute:
      database: test-db
      statement: "INSERT INTO users (user_id, first_name, last_name, email, active) VALUES (?, ?, ?, ?, ?)"
      params: ["${user.userId}", "${user.firstName}", "${user.lastName}", "${user.email}", true]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "SAP", "USER"]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "Workday", "USER"]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "ServiceNow", "USER"]

  - db.verify:
      database: test-db
      query: "SELECT * FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 3

  - db.execute:
      database: test-db
      statement: "DELETE FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]

  - db.verify:
      database: test-db
      query: "SELECT * FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 0

cleanup:
  - db.execute:
      database: test-db
      statement: "DELETE FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]

  - db.execute:
      database: test-db
      statement: "DELETE FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
