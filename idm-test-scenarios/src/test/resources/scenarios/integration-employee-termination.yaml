name: Complete employee termination workflow across all systems
description: Provision a fully active employee, revoke access and disable the account, verify the terminated state, then remove the user from LDAP and the database

fixtures:
  user:
    generate: random-user
    values:
      department: Sales

steps:
  - ldap.create:
      dn: "cn=${user.userId},ou=users"
      attributes:
        cn: "${user.userId}"
        sn: "${user.lastName}"
        givenName: "${user.firstName}"
        mail: "${user.email}"

  - db.execute:
      database: test-db
      statement: "INSERT INTO users (user_id, first_name, last_name, email, department, active) VALUES (?, ?, ?, ?, ?, ?)"
      params: ["${user.userId}", "${user.firstName}", "${user.lastName}", "${user.email}", "${user.department}", true]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "SAP", "USER"]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "Workday", "USER"]

  - db.execute:
      database: test-db
      statement: "INSERT INTO user_access (user_id, system_name, access_level, granted_date) VALUES (?, ?, ?, CURRENT_TIMESTAMP)"
      params: ["${user.userId}", "Email", "USER"]

  - db.execute:
      database: test-db
      statement: "DELETE FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]

  - ldap.update:
      dn: "cn=${user.userId},ou=users"
      attributes:
        loginDisabled: "TRUE"

  - db.execute:
      database: test-db
      statement: "UPDATE users SET active = false WHERE user_id = ?"
      params: ["${user.userId}"]

  - db.verify:
      database: test-db
      query: "SELECT * FROM user_access WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 0

  - db.verify:
      database: test-db
      query: "SELECT active FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
      expect:
        rowCount: 1
        row:
          active: false

  - ldap.delete:
      dn: "cn=${user.userId},ou=users"

  - db.execute:
      database: test-db
      statement: "DELETE FROM users WHERE user_id = ?"
      params: ["${user.userId}"]
