runner.cli.usage=Usage: idmtest <command> [options]\n\
\n\
Commands:\n\
\  init [<dir>]   create a workspace with an example scenario and settings\n\
\  validate       check the scenarios without connecting to any system\n\
\  run            run the scenarios against the systems of a profile\n\
\  ui             open the workbench in the browser (local only)\n\
\  trust import <certificate-file>|refresh\n\
\  trust import-server <host:port>\n\
\                 manage trusted TLS certificates for this user\n\
\  report <run-folder> --pdf summary|detailed\n\
\                 write a PDF evidence report from a finished run\n\
\  commands list|approve|revoke [<name>...]\n\
\                 show, approve or revoke the profile''s registered commands on this machine\n\
\n\
Options:\n\
\  --workspace <dir>   the workspace folder (default: the current folder)\n\
\  --profile <name>    the settings profile (config/application-<name>.yml)\n\
\  --scenario <glob>   only the scenarios whose name matches\n\
\  --locale <en|es>    the language of messages and reports\n\
\  --port <n>          ui: the port of the workbench (default: a free one)\n\
\  --verbose           also show the framework log on the console\n\
\  --yes               commands approve: approve without asking\n\
\  --pdf <kind>        report: summary or detailed (required)\n\
\  --out <file>        report: the PDF file (default: in the run folder)\n\
\  --help, -h          show this help\n\
\  --version           show the version
