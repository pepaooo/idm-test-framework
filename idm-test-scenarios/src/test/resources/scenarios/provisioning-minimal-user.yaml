name: Provision a user with minimal attributes
description: Create a user with only the required attributes and verify it exists

fixtures:
  user:
    generate: random-user

steps:
  - ldap.create:
      dn: "cn=${user.userId},ou=users"
      attributes:
        cn: "${user.userId}"
        sn: "${user.lastName}"
        givenName: "${user.firstName}"
        mail: "${user.email}"

  - ldap.verify:
      dn: "cn=${user.userId},ou=users"
      exists: true
