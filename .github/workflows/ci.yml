name: CI - Build and Test

# Builds every module and runs the whole test suite (the same command developers run locally).
# The default build needs no Docker: ContainerScenarios and RealEnvironmentScenarios run only when
# selected explicitly, so they are not part of this job.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege: read the code; write check runs only for the test report.
permissions:
  contents: read
  checks: write

# A newer push to the same branch or pull request cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # The Maven wrapper pins the project's Maven version; -B keeps the log readable.
      - name: Build and run all tests
        run: ./mvnw -B verify

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            **/target/surefire-reports/**
            idm-test-scenarios/target/*-results.json
            idm-test-scenarios/target/*-report.html
          retention-days: 7

      # Pinned to a commit (v3.0.0) because it is a third-party action. Skipped on pull requests from
      # forks, whose token cannot write check runs.
      - name: Publish test report
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        with:
          name: Test Results
          path: '**/target/surefire-reports/TEST-*.xml'
          reporter: java-junit
          fail-on-error: false
